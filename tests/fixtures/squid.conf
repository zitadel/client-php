# 3128 is an open forward proxy. 3129 is the same proxy but requires Basic
# proxy credentials, so the SDK can prove it sends Proxy-Authorization.
# basic_fake_auth accepts any user and password; what the tests check is
# that credentials arrive at all (407 without).
http_port 3128
http_port 3129 name=authport
auth_param basic program /usr/lib/squid/basic_fake_auth
auth_param basic realm sdk-test-proxy
acl all src all
acl on_auth_port myportname authport
acl authed proxy_auth REQUIRED
http_access deny on_auth_port !authed
http_access allow all
